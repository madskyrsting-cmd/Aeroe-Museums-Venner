# Ærø Museums Venner – redigering i Pages CMS
media:
  input: img/uploads
  output: /img/uploads

content:
  - name: forside
    label: Forsiden og tekster
    type: file
    path: content/forside.json
    format: json
    fields:
      - name: hero_image
        label: Forside – stort fotografi
        type: image
      - name: community_image
        label: Billeder – gårdrum og fællesskab
        type: image
      - name: garden_image
        label: Billeder – museumshaven
        type: image
      - name: museum_image
        label: Billeder – museets interiør
        type: image
      - name: hero_image_credit
        label: Fotokreditering
        type: string
      - name: hero_line1
        label: Forside – overskrift, første linje
        type: string
      - name: hero_line2
        label: Forside – overskrift, anden linje
        type: string
      - name: hero_description
        label: Forside – beskrivelse
        type: text
      - name: intro_lead
        label: Om foreningen – fremhævet tekst
        type: text
      - name: intro_body
        label: Om foreningen – næste tekst
        type: text
      - name: impact_description
        label: Vores betydning
        type: text
      - name: activities_description
        label: Aktiviteter og projekter
        type: text
      - name: member_description
        label: Bliv medlem – beskrivelse
        type: text
  - name: nyheder
    label: Nyheder
    type: file
    path: content/nyheder.json
    format: json
    list: true
    fields:
      - name: title
        label: Overskrift
        type: string
        required: true
      - name: date
        label: Dato
        type: date
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Kort beskrivelse
        type: text
      - name: body
        label: Hele nyheden
        type: text
      - name: image
        label: Billede
        type: image
      - name: image_alt
        label: Billedbeskrivelse
        type: string
      - name: published
        label: Vis på hjemmesiden
        type: boolean
  - name: arrangementer
    label: Arrangementer
    type: file
    path: content/arrangementer.json
    format: json
    list: true
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Dato og tidspunkt
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
      - name: location
        label: Sted
        type: string
      - name: description
        label: Beskrivelse
        type: text
      - name: published
        label: Vis på hjemmesiden
        type: boolean
