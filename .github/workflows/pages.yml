name: Offentliggør Ærø Museums Venner
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: museum-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent hjemmeside
        uses: actions/checkout@v4
      - name: Klargør GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload hjemmeside
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Offentliggør
        id: deployment
        uses: actions/deploy-pages@v4
